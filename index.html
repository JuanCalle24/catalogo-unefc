<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Participantes · Educación Inicial La Paz</title>
<script>try{var t=localStorage.getItem("tema")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">Educación Inicial · La Paz</p>
      <h1>Directorio de participantes</h1>
    </div>
    <button id="tema" class="icon" type="button" aria-label="Cambiar tema">◐</button>
  </header>

  <section class="stats" id="stats" aria-label="Resumen"></section>

  <section class="tools">
    <label class="search">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar por nombre, C.I., celular, depósito o unidad educativa" autocomplete="off" spellcheck="false" autofocus>
      <kbd>/</kbd>
    </label>
    <div class="seg" id="cursos" role="tablist" aria-label="Curso"></div>
    <div class="row">
      <select id="g" aria-label="Grupo"></select>
      <select id="u" aria-label="Unidad educativa"></select>
      <select id="e" aria-label="Estado de datos">
        <option value="">Todos los datos</option>
        <option value="sinCel">Sin celular</option>
        <option value="sinUe">Sin unidad educativa</option>
        <option value="sinCi">Sin C.I.</option>
        <option value="reciente">Registrados por formulario (recientes)</option>
      </select>
      <button id="limpiar" class="btn" type="button">Limpiar</button>
      <span class="spacer"></span>
      <button id="sinc" class="btn" type="button" title="Leer las inscripciones desde la hoja de Google Sheets">Actualizar ⟳</button>
      <button id="csv" class="btn" type="button">Exportar CSV</button>
      <button id="imprimir" class="btn" type="button">Imprimir</button>
    </div>
  </section>

  <p id="contador" class="count" aria-live="polite"></p>

  <div class="card">
    <table>
      <thead><tr>
        <th data-k="nombre" aria-sort="ascending">Participante</th>
        <th data-k="curso">Curso</th>
        <th data-k="ue">Unidad educativa</th>
        <th data-k="grupo">Grupo</th>
        <th data-k="celular">Celular</th>
      </tr></thead>
      <tbody id="filas"></tbody>
    </table>
    <div id="vacio" class="empty" hidden>
      <strong>Sin resultados</strong>
      <span>Prueba con otra palabra o limpia los filtros.</span>
    </div>
  </div>
</div>

<div id="velo" class="velo" hidden></div>
<aside id="panel" class="panel" role="dialog" aria-modal="true" aria-label="Detalle del participante" aria-hidden="true">
  <button id="cerrar" class="icon cerrar" type="button" aria-label="Cerrar">×</button>
  <div id="detalle"></div>
</aside>
<div id="toast" class="toast" role="status"></div>

<script src="datos.js?v=3"></script>
<script src="app.js?v=3"></script>
</body>
</html>
